version: 2

project_name: nodered-mcp

before:
  hooks:
    # Keep this list to plain, shell-free commands: goreleaser splits
    # each hook with shlex and execs it directly, so `&&`, pipes and
    # nested quoting do not work here (#218 tried a sed one-liner and
    # every release died with "invalid command line string"). The
    # bin/install.js VERSION constant is bumped by hand and guarded by
    # npm.yml, which checks out its own copy of the source — a sed in
    # this hook could never have satisfied that gate anyway.
    - go mod tidy

builds:
  - id: nodered-mcp
    main: ./cmd/nodered-mcp
    binary: nodered-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # No version in the name so the `latest/download/<asset>` URL is stable
    # across releases — that's what the install scripts rely on.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - examples/**

checksum:
  name_template: checksums.txt

# SBOM (issue #179). CycloneDX is the OpenSSF Scorecard-friendly
# default; SPDX is the alternative if a downstream consumer asks for
# it. Attestation (cosign keyless signing) lives behind GoReleaser
# Pro, so we only emit the SBOM here.
#
# The format is selected by the `--output` arg, NOT by `documents` —
# `documents` is only the output filename. Setting it to a bare
# "cyclonedx" gave all six binaries the same asset name and the
# release died on the second upload with a 404. Leaving `documents`
# unset uses goreleaser's per-binary default
# ({{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json),
# which is unique by construction.
sboms:
  - id: default
    artifacts: binary
    args: ["$artifact", "--output", "cyclonedx-json=$document"]


changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
