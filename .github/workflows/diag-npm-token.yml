name: diag-npm-token

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: whoami with secret
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          echo "--- secret length: ${#NPM_SECRET}"
          echo "--- secret first 4: ${NPM_SECRET:0:4}"
          echo "--- secret last 4: ${NPM_SECRET: -4}"
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          echo "--- npm whoami:"
          npm whoami
          echo "--- npm token list (basic):"
          npm token list 2>&1 | head -10
          echo "--- try view existing main package:"
          npm view @fgjcarlos/nodered-mcp version 2>&1 | head -5
          echo "--- try view a non-existent package (should be E404 GET):"
          npm view @fgjcarlos/nodered-mcp-does-not-exist version 2>&1 | head -5
          echo "--- check scope page:"
          curl -fsS -H "Authorization: Bearer ${NPM_SECRET}" \
            https://registry.npmjs.org/-/v1/search?text=scope:fgjcarlos 2>&1 | head -20
