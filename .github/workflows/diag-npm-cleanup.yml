name: diag-npm-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-npm-cleanup.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: clean residual dist-tags and test fresh publish
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          set -euo pipefail
          printf "%s\n" "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          echo "--- pre-state @fgjcarlos/nodered-mcp-darwin-x64:"
          npm view @fgjcarlos/nodered-mcp-darwin-x64 dist-tags 2>&1 || echo "no package"
          echo "--- remove dist-tag next:"
          npm dist-tag rm @fgjcarlos/nodered-mcp-darwin-x64 next 2>&1 || true
          npm dist-tag rm @fgjcarlos/nodered-mcp-darwin-x64 latest 2>&1 || true
          echo "--- post-state dist-tags:"
          npm view @fgjcarlos/nodered-mcp-darwin-x64 dist-tags 2>&1 || echo "no package"
          echo "--- also clean the other 5 if they exist:"
          for plat in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-arm64; do
            npm dist-tag rm @fgjcarlos/nodered-mcp-$plat next 2>&1 || true
            npm dist-tag rm @fgjcarlos/nodered-mcp-$plat latest 2>&1 || true
          done
          echo "--- now use the EXACT workflow command from npm.yml:"
          cd npm-packages
          TARBALL=$(ls nodered-mcp-darwin-x64-0.7.0.tgz | head -1)
          echo "TARBALL=[$TARBALL]"
          ls -la "$TARBALL"
          echo "--- npm publish:"
          npm publish --access public --tag next "$TARBALL" 2>&1 | tail -20 || true
          echo "--- dist-tags after:"
          npm view @fgjcarlos/nodered-mcp-darwin-x64 dist-tags 2>&1 || echo "no package"
          echo "--- DO NOT unpublish now, leave 0.7.0 published for the real workflow continuation."
