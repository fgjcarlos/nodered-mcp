name: diag-npm-publish-mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-npm-publish-mirror.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: v0.7.0
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: build tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout v0.7.0 -- npm/ scripts/build-platform-packages.js
          mkdir -p dist
          gh release download "v0.7.0" --repo "${{ github.repository }}" --pattern '*.tar.gz' --pattern 'checksums.txt' --dir dist
          cd dist && sha256sum --ignore-missing --check checksums.txt && cd ..
          node scripts/build-platform-packages.js --version 0.7.0 --dist dist --out npm-packages
          ls -la npm-packages/

      - name: MIRROR the workflow logic exactly (publish platform packages)
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
          VERSION: v0.7.0
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          version="${VERSION#v}"
          cd npm-packages
          rm -f win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            tarball="${pkg}-${version}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "platform tarball missing: $tarball"
              exit 1
            fi
            scope="@fgjcarlos/${pkg}"
            if npm view "${scope}@${version}" version >/dev/null 2>&1; then
              echo "${scope}@${version} already published; skipping"
              continue
            fi
            echo "--- npmrc content:"
            cat ~/.npmrc
            echo "--- about to publish ./$tarball (size $(stat -c%s $tarball))"
            npm publish --access public --tag next "./$tarball" 2>&1 | tail -20 || true
            echo "--- done"
          done
