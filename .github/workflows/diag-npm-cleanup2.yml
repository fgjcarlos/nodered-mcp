name: diag-npm-cleanup2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-npm-cleanup2.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: clean residual dist-tags
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          set +e
          printf "%s\n" "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          echo "--- try remove dist-tag latest from darwin-x64:"
          npm dist-tag rm @fgjcarlos/nodered-mcp-darwin-x64 latest 2>&1
          echo "--- try remove dist-tag next:"
          npm dist-tag rm @fgjcarlos/nodered-mcp-darwin-x64 next 2>&1
          echo "--- post-state:"
          npm view @fgjcarlos/nodered-mcp-darwin-x64 dist-tags 2>&1 || echo "no package (good)"
          echo "--- main package dist-tags:"
          npm view @fgjcarlos/nodered-mcp dist-tags 2>&1
