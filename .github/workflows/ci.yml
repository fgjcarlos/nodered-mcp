name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Allows running the suite by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting, vetting and linting are platform-independent, so they run once
  # rather than three times in the matrix below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # `cache: false` because golang/govulncheck-action@v1 runs its own
      # setup-go internally and the two caches collide on Go 1.25+ with
      # `tar: Cannot open: File exists` errors (issue #66 follow-up).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # .gitattributes pins text sources to LF (issue #67); this gate prevents
      # new CRLF noise from sneaking in via copy-paste or Windows checkouts.
      - name: no CRLF in text sources
        run: |
          # Windows runners use \r\n in checkout by default, so only enforce on
          # Linux/macOS where the working tree is owned by .gitattributes.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Skipping CRLF check on Windows (core.autocrlf may rewrite)."
            exit 0
          fi
          crlf=$(git grep -nIE $'\r' -- '*.go' '*.sh' '*.yaml' '*.yml' '*.json' '*.md' '*.ps1' '*.js' '*.toml' '*.txt' 'go.mod' 'go.sum' 'Dockerfile' 'LICENSE' '.gitignore' '.dockerignore' '.env.example' ':!.gitattributes' || true)
          if [ -n "$crlf" ]; then
            echo "These files contain CRLF line endings:"
            echo "$crlf"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # govulncheck is a fast security gate against the reachable subset of
      # the Go vulnerability database. The audit exposed 12 reachable stdlib
      # advisories on Go 1.25.5 (issue #66); bumping the toolchain cleared
      # them all. This step keeps that floor from regressing.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1
        with:
          go-version-file: go.mod

      # Coverage ratchet (issue #69): aggregate statement coverage across
      # every production package and fail if it drops below the pinned
      # baseline. The baseline lives at scripts/coverage-baseline.txt so
      # bumping it is a deliberate commit (run scripts/coverage-ratchet.sh
      # --write locally).
      - name: coverage ratchet
        run: bash scripts/coverage-ratchet.sh

      # Complexity check (issue #73): five named functions must stay
      # at or below the agreed threshold (15) and may not regress vs.
      # their per-function baseline. The tool pinned is gocyclo;
      # install it at the top of the step because the runner's
      # pre-installed go bin does not include it.
      - name: install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: complexity check
        run: bash scripts/complexity-check.sh

  # nodered-mcp ships for Linux, macOS and Windows, and it does real work with
  # OS-specific paths (backup directories, per-client config locations in the
  # init command). Testing on one platform would not cover that.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  # The npm wrapper in bin/ has its own guards and nothing was running them.
  # install_message_test.js is the one that fails when the asset map drifts
  # away from what goreleaser publishes -- the exact break that stalled the
  # v0.6.0 release behind a 404. They are plain node scripts with no
  # dependencies, so there is nothing to install.
  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 18  # the floor declared in package.json engines

      - name: node bin tests
        run: |
          set -euo pipefail
          for t in bin/*_test.js; do
            echo "--- $t"
            node "$t"
          done

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: build and smoke-test Docker image
        run: bash scripts/docker-smoke.sh

  # The race detector needs a working C toolchain, which is only dependable on
  # the Linux runner. Data races are OS-independent anyway — the matrix above
  # exists for path handling, not for concurrency.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -race
        run: go test -race ./...

  # A release builds for six OS/arch pairs. Catching a cross-compilation break
  # here is cheaper than catching it when a tag is already pushed.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/nodered-mcp
            echo "ok $target"
          done
