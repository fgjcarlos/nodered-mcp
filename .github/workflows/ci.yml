name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Allows running the suite by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting, vetting and linting are platform-independent, so they run once
  # rather than three times in the matrix below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # `cache: false` because golang/govulncheck-action@v1 runs its own
      # setup-go internally and the two caches collide on Go 1.25+ with
      # `tar: Cannot open: File exists` errors (issue #66 follow-up).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # .gitattributes pins text sources to LF (issue #67); this gate prevents
      # new CRLF noise from sneaking in via copy-paste or Windows checkouts.
      - name: no CRLF in text sources
        run: |
          # Windows runners use \r\n in checkout by default, so only enforce on
          # Linux/macOS where the working tree is owned by .gitattributes.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Skipping CRLF check on Windows (core.autocrlf may rewrite)."
            exit 0
          fi
          crlf=$(git grep -nIE $'\r' -- '*.go' '*.sh' '*.yaml' '*.yml' '*.json' '*.md' '*.ps1' '*.js' '*.toml' '*.txt' 'go.mod' 'go.sum' 'Dockerfile' 'LICENSE' '.gitignore' '.dockerignore' '.env.example' ':!.gitattributes' || true)
          if [ -n "$crlf" ]; then
            echo "These files contain CRLF line endings:"
            echo "$crlf"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # govulncheck is a fast security gate against the reachable subset of
      # the Go vulnerability database. The audit exposed 12 reachable stdlib
      # advisories on Go 1.25.5 (issue #66); bumping the toolchain cleared
      # them all. This step keeps that floor from regressing.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1
        with:
          go-version-file: go.mod

      # Coverage ratchet (issue #69): aggregate statement coverage across
      # every production package and fail if it drops below the pinned
      # baseline. The baseline lives at scripts/coverage-baseline.txt so
      # bumping it is a deliberate commit (run scripts/coverage-ratchet.sh
      # --write locally).
      - name: coverage ratchet
        run: bash scripts/coverage-ratchet.sh

      # Complexity check (issue #73): five named functions must stay
      # at or below the agreed threshold (15) and may not regress vs.
      # their per-function baseline. The tool pinned is gocyclo;
      # install it at the top of the step because the runner's
      # pre-installed go bin does not include it.
      - name: install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: complexity check
        run: bash scripts/complexity-check.sh

  # nodered-mcp ships for Linux, macOS and Windows, and it does real work with
  # OS-specific paths (backup directories, per-client config locations in the
  # init command). Testing on one platform would not cover that.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  # The npm wrapper in bin/ has its own guards and nothing was
  # running them. shim_test.js covers the platform-resolver contract;
  # build-platform-packages_test.js covers the npm-tarball producer;
  # npm_release_gate_test.js covers the GitHub-Release-side gate.
  # They are plain node scripts with no dependencies, so there is
  # nothing to install.
  npm-wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 18  # the floor declared in package.json engines

      - name: node bin tests
        shell: bash
        run: |
          set -euo pipefail
          for t in bin/*_test.js; do
            echo "--- $t"
            node "$t"
          done

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: build and smoke-test Docker image
        run: bash scripts/docker-smoke.sh

  # The race detector needs a working C toolchain, which is only dependable on
  # the Linux runner. Data races are OS-independent anyway — the matrix above
  # exists for path handling, not for concurrency.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -race
        run: go test -race ./...

  # A release builds for six OS/arch pairs. Catching a cross-compilation break
  # here is cheaper than catching it when a tag is already pushed.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/nodered-mcp
            echo "ok $target"
          done

  # Issue #258: real-artifact contract gate. Runs goreleaser in
  # --snapshot mode against the PR's source tree, then inspects every
  # generated archive against the native-package contract. Catches
  # .goreleaser.yaml drifts before they ship as a broken release. The
  # in-memory bin/release-snapshot_test.js also runs in the npm-wrapper
  # matrix above for the Windows / non-goreleaser path.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: install syft for snapshot SBOMs
        env:
          SYFT_VERSION: v1.27.0
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh | sh -s -- -b /usr/local/bin ${SYFT_VERSION}
          syft version

      # Use the same pinned action and v2 selector as release.yml.
      # The previous direct v2.4.8 download could not parse the
      # repository's current `archives.formats` configuration.
      - name: build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: inspect release snapshot
        run: node scripts/release-snapshot.js --skip-build

      - name: upload inspected snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-snapshot-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Build npm-native packages from the exact snapshot bytes and launch
  # the installed CLI with lifecycle scripts disabled on every OS.
  release-artifact-smoke:
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 18

      - name: download inspected snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-snapshot-dist
          path: dist

      - name: install packed npm package and launch native CLI
        run: node scripts/release-artifact-smoke.js --dist-dir dist
