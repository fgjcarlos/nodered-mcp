name: npm

# npm publication is gated on the release workflow's success.
#
# release.yml produces the GitHub Release (binaries, checksums.txt,
# SBOMs) for the tag. The npm channel as of 0.7.0 (#257) ships the
# six native binaries as separate npm packages — see the
# `optionalDependencies` block in package.json — and a thin wrapper
# that re-execs the matching one for process.platform / process.arch.
# Because npm registry integrity now replaces the custom checksum
# path, the publish gate is the asset contract on the GitHub Release
# (goreleaser produced everything the wrapper expects) plus the
# exact-version pin between the seven packages.
#
# The trigger below makes the order deterministic: this workflow
# only sees a tag once release.yml has reported `completed` with
# `success`. Inside the job, scripts/release-gate.js verifies the
# GitHub Release carries checksums.txt and every required tarball,
# and scripts/build-platform-packages.js assembles the six native
# npm packages from goreleaser's dist/. Then the publication step
# publishes the six platform packages first and the main package
# last, in the order the issue mandates. Any failure inside the
# gate exits non-zero before `npm publish` is touched, so a
# half-built release cannot ship a working npm wrapper.
on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

permissions:
  contents: read
  # id-token: write is required by npm provenance so the publish
  # step can attach a build attestation via OIDC. Without it, the
  # package.json "provenance": true flag has no effect.
  id-token: write

jobs:
  publish:
    # Skip the job entirely when release.yml did not succeed; an
    # aborted, cancelled, or failed release means assets are
    # incomplete and npm publish must not happen. The head_branch
    # guard is a belt-and-braces against workflow_run firing from
    # any non-tag push that release.yml could ever be triggered by
    # in the future.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The triggering release.yml run executed against the tag;
          # checkout the same ref so the version gate below reads the
          # post-bump package.json. workflow_run events otherwise run
          # on the default branch.
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: verify package.json version matches the tag
        env:
          EXPECTED: ${{ env.TAG }}
        run: |
          actual=$(jq -r .version package.json)
          expected="${EXPECTED#v}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi

      # Verify the GitHub Release for this tag actually carries the
      # exact assets the npm wrapper depends on. release.yml is the
      # producer; this step is the consumer's gate. The asset names
      # come from the goreleaser `name_template` and are also the
      # list scripts/build-platform-packages.js consumes, so the
      # release gate and the npm publisher cannot drift. A
      # "succeeded" workflow_run that left the Release empty
      # (goreleaser config drift, SBOM step errored out, draft
      # toggle flipped on, etc.) fails here, before npm is touched.
      - name: verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.js "$TAG" "${{ github.repository }}"

      # Download the exact archives already published by release.yml;
      # rebuilding here could produce bytes different from the GitHub
      # Release. scripts/build-platform-packages.js then pairs each with
      # the matching manifest under npm/<key>/package.json and emits
      # one npm-ready .tgz per platform. The .tgz files end up under
      # npm-packages/ ready for `npm publish`.
      - name: download published native archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt' \
            --dir dist

      - name: verify downloaded archive checksums
        run: |
          cd dist
          sha256sum --ignore-missing --check checksums.txt

      - name: assemble platform packages
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          node scripts/build-platform-packages.js \
            --version "${VERSION#v}" \
            --dist dist \
            --out npm-packages

      # Pre-flight: every required platform package must be
      # buildable before publish touches the registry. The script
      # already fails closed; this is belt-and-braces so the
      # failure mode names each missing platform explicitly.
      - name: verify platform packages built
        run: |
          expected="nodered-mcp-win32-x64 nodered-mcp-win32-arm64 nodered-mcp-linux-x64 nodered-mcp-linux-arm64 nodered-mcp-darwin-x64 nodered-mcp-darwin-arm64"
          missing=""
          for pkg in $expected; do
            if ! ls "npm-packages/${pkg}-$(jq -r .version package.json).tgz" >/dev/null 2>&1; then
              missing="$missing $pkg"
            fi
          done
          if [ -n "$missing" ]; then
            echo "missing platform packages:$missing"
            exit 1
          fi

      - name: pack main package before publication
        run: npm pack --json --pack-destination npm-packages .

      # Publish the six native packages first, then the main package.
      # npm versions are immutable, so a retry of an already-published
      # exact version is a no-op (`npm publish` on a live version
      # fails with E403). The registry check before publish keeps a
      # re-run idempotent without leaving partial-release states
      # (which is the partial-publication risk the issue calls out).
      #
      # Steps 4-6 of the issue's publication ordering map to:
      #   4. publish or verify the six platform packages first
      #   5. confirm all six exact versions are readable from the registry
      #   6. publish the main package only after all native packages exist
      #
      # Step 7 (idempotency) is the registry check in the inner loop.
      # Every new package first lands under the `next` canary tag.
      # `latest` is promoted only after registry metadata and a fresh
      # install from npm have passed below.
      - name: publish platform packages
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          version="${VERSION#v}"
          cd npm-packages
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            tarball="${pkg}-${version}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "platform tarball missing: $tarball"
              exit 1
            fi
            # Resolve the scoped package name to check the registry.
            scope="@fgjcarlos/${pkg}"
            if npm view "${scope}@${version}" version >/dev/null 2>&1; then
              echo "${scope}@${version} already published; skipping"
              continue
            fi
            npm publish --access public --provenance --tag next "$tarball"
            echo "published ${scope}@${version}"
          done

      - name: verify all platform packages are live
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${VERSION#v}"
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            scope="@fgjcarlos/${pkg}"
            verified=""
            for attempt in 1 2 3 4 5; do
              integrity=$(npm view "${scope}@${version}" dist.integrity 2>/dev/null || true)
              attestation=$(npm view "${scope}@${version}" dist.attestations.url 2>/dev/null || true)
              if [ -n "$integrity" ] && [ -n "$attestation" ]; then
                verified=yes
                break
              fi
              sleep $((attempt * 3))
            done
            if [ -z "$verified" ]; then
              echo "platform package lacks registry integrity or provenance: ${scope}@${version}"
              exit 1
            fi
            echo "verified integrity and provenance for ${scope}@${version}"
          done

      - name: publish main package
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          version=$(jq -r .version package.json)
          if npm view "@fgjcarlos/nodered-mcp@${version}" version >/dev/null 2>&1; then
            echo "@fgjcarlos/nodered-mcp@${version} is already published; nothing to do."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          npm publish --access public --provenance --tag next

      - name: verify main package integrity and provenance
        run: |
          version=$(jq -r .version package.json)
          integrity=$(npm view "@fgjcarlos/nodered-mcp@${version}" dist.integrity)
          attestation=$(npm view "@fgjcarlos/nodered-mcp@${version}" dist.attestations.url)
          if [ -z "$integrity" ] || [ -z "$attestation" ]; then
            echo "main package lacks registry integrity or provenance"
            exit 1
          fi

      - name: install and launch canary from npm registry
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          prefix=$(mktemp -d)
          trap 'rm -rf "$prefix"' EXIT
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund \
            "@fgjcarlos/nodered-mcp@${version}"
          reported=$($prefix/bin/nodered-mcp version)
          if [[ "$reported" != *"$version"* ]]; then
            echo "canary executable reported '$reported', expected $version"
            exit 1
          fi
          echo "canary install passed: $reported"

      - name: promote verified packages to latest
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          version=$(jq -r .version package.json)
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            npm dist-tag add "@fgjcarlos/${pkg}@${version}" latest
          done
          # Promote the user-facing package last: until this command,
          # npm install @latest still resolves the previous release.
          npm dist-tag add "@fgjcarlos/nodered-mcp@${version}" latest
          latest=$(npm view @fgjcarlos/nodered-mcp dist-tags.latest)
          if [ "$latest" != "$version" ]; then
            echo "latest tag is $latest, expected $version"
            exit 1
          fi

      - name: deprecate broken 0.6.2 npm release
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          if npm view "@fgjcarlos/nodered-mcp@0.6.2" version >/dev/null 2>&1; then
            echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
            npm deprecate "@fgjcarlos/nodered-mcp@0.6.2" \
              "Broken Windows installer; upgrade to @fgjcarlos/nodered-mcp@latest"
          fi
