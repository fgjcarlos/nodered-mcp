name: npm

# Mirror release.yml's trigger — every pushed tag produces a fresh npm
# publish, so a release that publishes a binary also publishes an
# npm-installable wrapper at the same version. The wrapper itself is
# versioned in package.json, bumped by hand; this workflow reads that
# version and refuses to publish if it does not match the tag, so a
# mismatched package.json never ships.
#
# The wrapper's postinstall downloads a tarball whose URL embeds the
# `bin/install.js` VERSION constant — if that constant lags the tag, a
# fresh `npm install -g @fgjcarlos/nodered-mcp` silently downloads the
# previous release's tarball. We gate on that constant here too.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # id-token: write is required by npm provenance so the publish
  # step can attach a build attestation via OIDC. Without it, the
  # package.json "provenance": true flag has no effect.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The version match check runs inline with the read because GitHub
      # Actions' step-output parser rejects any value that looks like a
      # number ("0.5.3" is treated as a float). Passing the value
      # through `>> $GITHUB_OUTPUT` and then interpolating it in a
      # later step throws `Invalid format '0.5.3'`. Reading + checking
      # in the same shell avoids the issue entirely and is shorter.
      - name: verify package.json version matches the tag
        env:
          EXPECTED: ${{ github.ref_name }}
        run: |
          actual=$(jq -r .version package.json)
          expected="${EXPECTED#v}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi

      # Same gate as above, but for the bin/install.js VERSION constant —
      # the wrapper's postinstall builds its tarball URL from this
      # literal. A stale constant here is the bug from #146: the gate on
      # package.json would pass, the npm publish would succeed, and a
      # fresh `npm install -g` would silently download the previous
      # tag's binary. The grep targets the line we keep by convention;
      # a `const VERSION = ...` declaration is the contract.
      - name: verify bin/install.js VERSION matches the tag
        env:
          EXPECTED: ${{ github.ref_name }}
        run: |
          actual=$(grep -E "^const VERSION = '[^']+';" bin/install.js | head -1 | sed -E "s/^const VERSION = '([^']+)';.*/\\1/")
          expected="${EXPECTED#v}"
          if [ -z "$actual" ]; then
            echo "could not parse VERSION from bin/install.js"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "bin/install.js VERSION ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi

      # npm publish reads NODE_AUTH_TOKEN from env, but on a fresh
      # runner the empty ~/.npmrc can shadow it; writing the token to
      # .npmrc avoids that race entirely. The file lives in the
      # runner's home and is not committed.
      - name: publish
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          npm publish --access public
