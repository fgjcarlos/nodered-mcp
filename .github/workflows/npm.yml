name: npm

# npm publication is gated on the release workflow's success.
#
# release.yml produces the GitHub Release (binaries, checksums.txt,
# SBOMs) for the tag. The npm wrapper's postinstall downloads a
# tarball whose URL is built from the tag, so if this workflow runs
# before release.yml finishes (or before its assets are queryable),
# a fresh `npm install -g` 404s on the tarball — and npm versions
# are immutable, so a retry is a no-op. The previous design fired
# both workflows on tag push and let the scheduler race them;
# publishing could land before any binary was uploaded, with no
# signal at the publish step that anything was wrong.
#
# The trigger below makes the order deterministic: this workflow
# only sees a tag once release.yml has reported `completed` with
# `success`. Inside the job, scripts/release-gate.js then verifies
# the GitHub Release carries checksums.txt, at least one tarball,
# and at least one SBOM, and that checksums.txt is internally
# consistent. Any failure inside the gate exits non-zero before
# `npm publish` is touched, so a half-built release cannot ship a
# working npm wrapper.
on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

permissions:
  contents: read
  # id-token: write is required by npm provenance so the publish
  # step can attach a build attestation via OIDC. Without it, the
  # package.json "provenance": true flag has no effect.
  id-token: write

jobs:
  publish:
    # Skip the job entirely when release.yml did not succeed; an
    # aborted, cancelled, or failed release means assets are
    # incomplete and npm publish must not happen. The head_branch
    # guard is a belt-and-braces against workflow_run firing from
    # any non-tag push that release.yml could ever be triggered by
    # in the future.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The triggering release.yml run executed against the tag;
          # checkout the same ref so the version gate below reads the
          # post-bump package.json. workflow_run events otherwise run
          # on the default branch.
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      # The version match check runs inline with the read because GitHub
      # Actions' step-output parser rejects any value that looks like a
      # number ("0.5.3" is treated as a float). Passing the value
      # through `>> $GITHUB_OUTPUT` and then interpolating it in a
      # later step throws `Invalid format '0.5.3'`. Reading + checking
      # in the same shell avoids the issue entirely and is shorter.
      - name: verify package.json version matches the tag
        env:
          EXPECTED: ${{ env.TAG }}
        run: |
          actual=$(jq -r .version package.json)
          expected="${EXPECTED#v}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi

      # Verify the GitHub Release for this tag actually carries the
      # assets the npm wrapper depends on. release.yml is the
      # producer; this step is the consumer's gate. A "succeeded"
      # workflow_run that left the Release empty (goreleaser config
      # drift, SBOM step errored out, draft toggle flipped on, etc.)
      # fails here, before npm is touched.
      - name: verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.js "$TAG" "${{ github.repository }}"

      # npm publish reads NODE_AUTH_TOKEN from env, but on a fresh
      # runner the empty ~/.npmrc can shadow it; writing the token to
      # .npmrc avoids that race entirely. The file lives in the
      # runner's home and is not committed.
      # Re-pushing a tag to retry a failed goreleaser run re-triggers this
      # workflow, and npm versions are immutable — a blind `npm publish`
      # would fail the job with a 403 for a version that is already live.
      # The registry check makes the retry a no-op instead.
      - name: publish
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          version=$(jq -r .version package.json)
          if npm view "@fgjcarlos/nodered-mcp@${version}" version >/dev/null 2>&1; then
            echo "@fgjcarlos/nodered-mcp@${version} is already published; nothing to do."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          npm publish --access public