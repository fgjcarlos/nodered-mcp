name: npm

# npm publication is gated on the release workflow's success.
#
# release.yml produces the GitHub Release (binaries, checksums.txt,
# SBOMs) for the tag. The npm channel as of 0.7.0 (#257) ships the
# six native binaries as separate npm packages — see the
# `optionalDependencies` block in package.json — and a thin wrapper
# that re-execs the matching one for process.platform / process.arch.
# Because npm registry integrity now replaces the custom checksum
# path, the publish gate is the asset contract on the GitHub Release
# (goreleaser produced everything the wrapper expects) plus the
# exact-version pin between the seven packages.
#
# The trigger below makes the order deterministic: this workflow
# only sees a tag once release.yml has reported `completed` with
# `success`. The two jobs run in parallel: publish-platforms uses
# NPM_SECRET (a bypass-2FA automation token) to publish the six
# scoped platform packages, and publish-main uses NPM_SECRET as well
# to publish the meta package. The meta package sits in the npmjs
# dead-lock documented at #278: a Trusted Publisher entry existed for
# it, so npmjs was rejecting every publish attempt with E403 (token)
# or E404 (OIDC, via npm/cli#8678). The token path is the only one
# that works while no Trusted Publisher is configured; the OIDC path
# requires deleting and re-creating the Trusted Publisher entry on
# npmjs Settings, which is currently disabled until 0.7.0 publishes.
#
# Order semantics: a partial release (platforms only, or main only)
# is recoverable on rerun. The CLI smoke test below runs only after
# both jobs succeed.
on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

permissions:
  contents: read
  # id-token: write is required by npm provenance so the publish
  # step can attach a build attestation via OIDC. Without it, the
  # package.json "provenance": true flag has no effect.
  id-token: write

jobs:
  publish-platforms:
    # Skip the job entirely when release.yml did not succeed; an
    # aborted, cancelled, or failed release means assets are
    # incomplete and npm publish must not happen. The head_branch
    # guard is a belt-and-braces against workflow_run firing from
    # any non-tag push that release.yml could ever be triggered by
    # in the future.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The triggering release.yml run executed against the tag;
          # checkout the same ref so the version gate below reads the
          # post-bump package.json. workflow_run events otherwise run
          # on the default branch.
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        # No registry-url here: setting it tells actions/setup-node
        # to write a runtime .npmrc that routes npm publish through
        # a tokenless path the registry rejects with E404 on scoped
        # packages. We use NPM_SECRET directly in the publish step.
        with:
          node-version: 20

      - name: verify package.json version matches the tag
        env:
          EXPECTED: ${{ env.TAG }}
        run: |
          actual=$(jq -r .version package.json)
          expected="${EXPECTED#v}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi

      # Verify the GitHub Release for this tag actually carries the
      # exact assets the npm wrapper depends on. release.yml is the
      # producer; this step is the consumer's gate. The asset names
      # come from the goreleaser `name_template` and are also the
      # list scripts/build-platform-packages.js consumes, so the
      # release gate and the npm publisher cannot drift. A
      # "succeeded" workflow_run that left the Release empty
      # (goreleaser config drift, SBOM step errored out, draft
      # toggle flipped on, etc.) fails here, before npm is touched.
      - name: verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.js "$TAG" "${{ github.repository }}"

      # Download the exact archives already published by release.yml;
      # rebuilding here could produce bytes different from the GitHub
      # Release. scripts/build-platform-packages.js then pairs each with
      # the matching manifest under npm/<key>/package.json and emits
      # one npm-ready .tgz per platform. The .tgz files end up under
      # npm-packages/ ready for `npm publish`.
      - name: download published native archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt' \
            --dir dist

      - name: verify downloaded archive checksums
        run: |
          cd dist
          sha256sum --ignore-missing --check checksums.txt

      - name: assemble platform packages
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          node scripts/build-platform-packages.js \
            --version "${VERSION#v}" \
            --dist dist \
            --out npm-packages

      # Pre-flight: every required platform package must be
      # buildable before publish touches the registry. The script
      # already fails closed; this is belt-and-braces so the
      # failure mode names each missing platform explicitly.
      - name: verify platform packages built
        run: |
          expected="nodered-mcp-win32-x64 nodered-mcp-win32-arm64 nodered-mcp-linux-x64 nodered-mcp-linux-arm64 nodered-mcp-darwin-x64 nodered-mcp-darwin-arm64"
          missing=""
          for pkg in $expected; do
            if ! ls "npm-packages/${pkg}-$(jq -r .version package.json).tgz" >/dev/null 2>&1; then
              missing="$missing $pkg"
            fi
          done
          if [ -n "$missing" ]; then
            echo "missing platform packages:$missing"
            exit 1
          fi

      # Publish the six native packages. npm versions are immutable,
      # so a retry of an already-published exact version is a no-op
      # (`npm publish` on a live version fails with E403). The
      # registry check before publish keeps a re-run idempotent
      # without leaving partial-release states.
      - name: publish platform packages
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          version="${VERSION#v}"
          cd npm-packages
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            tarball="${pkg}-${version}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "platform tarball missing: $tarball"
              exit 1
            fi
            scope="@fgjcarlos/${pkg}"
            if npm view "${scope}@${version}" version >/dev/null 2>&1; then
              echo "${scope}@${version} already published; skipping"
              continue
            fi
            # Platform packages do not have a Trusted Publisher
            # configured yet (the npmjs Settings UI only lets you
            # add one after the package exists, and the first
            # publish creates the scoped package). Publish without
            # --provenance so the registry accepts the create; the
            # main package publishes via OIDC in the publish-main
            # job. Add Trusted Publisher per platform package once
            # each exists on npmjs, then restore --provenance here.
            # ponytail: keep simple, upgrade after each platform
            # package has at least one public version.
            npm publish --access public --tag next "./$tarball"
            echo "published ${scope}@${version}"
          done

      - name: verify all platform packages are live
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${VERSION#v}"
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            scope="@fgjcarlos/${pkg}"
            verified=""
            for attempt in 1 2 3 4 5; do
              integrity=$(npm view "${scope}@${version}" dist.integrity 2>/dev/null || true)
              if [ -n "$integrity" ]; then
                verified=yes
                break
              fi
              sleep $((attempt * 3))
            done
            if [ -z "$verified" ]; then
              echo "platform package lacks registry integrity: ${scope}@${version}"
              exit 1
            fi
            echo "verified integrity for ${scope}@${version}"
          done

      - name: promote platform packages to latest
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          version="${VERSION#v}"
          for pkg in \
            nodered-mcp-win32-x64 \
            nodered-mcp-win32-arm64 \
            nodered-mcp-linux-x64 \
            nodered-mcp-linux-arm64 \
            nodered-mcp-darwin-x64 \
            nodered-mcp-darwin-arm64; do
            npm dist-tag add "@fgjcarlos/${pkg}@${version}" latest
          done

  publish-main:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      # Use NPM_SECRET (bypass-2FA automation token) instead of the
      # OIDC Trusted Publisher path. As of 2026-08-06 (#278), once a
      # Trusted Publisher is configured for a package on npmjs, OIDC
      # publish of a new version on that pre-existing package returns
      # E404 (npm/cli#8678 — npmjs does not retro-attach the trust-
      # link to packages whose earlier versions were token-published).
      # Setting `registry-url` here triggers that same E404 path. The
      # token path also fails with E403 when a Trusted Publisher is
      # active. The unblock sequence is:
      #   1. Delete the Trusted Publisher entry on npmjs Settings.
      #   2. Push the v0.7.0 tag — this workflow publishes with the
      #      token and bypasses both errors.
      #   3. Re-create the Trusted Publisher entry on npmjs. The next
      #      release can re-enable the OIDC flow by adding
      #      `registry-url: https://registry.npmjs.org` and dropping
      #      the `~/.npmrc` write below.
      # ponytail: keep the token path reversible, document upgrade.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20

      - name: verify package.json version matches the tag
        env:
          EXPECTED: ${{ env.TAG }}
        run: |
          actual=$(jq -r .version package.json)
          expected="${EXPECTED#v}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) does not match tag $EXPECTED (expected $expected)"
            exit 1
          fi


      - name: publish main package
        # NPM_SECRET is a bypass-2FA automation token. The current
        # branch uses it because the meta package sits in the npmjs
        # dead-lock documented at #278 (Trusted Publisher blocks
        # tokens AND OIDC). After Trusted Publisher is re-created
        # post-0.7.0, this step should switch back to the OIDC path:
        # drop the `~/.npmrc` write, re-add `registry-url` to
        # setup-node above, drop `--provenance` (it attaches but
        # npmjs accepts missing attestation for non-first publishes).
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          version=$(jq -r .version package.json)
          if npm view "@fgjcarlos/nodered-mcp@${version}" version >/dev/null 2>&1; then
            echo "@fgjcarlos/nodered-mcp@${version} is already published; nothing to do."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          npm publish --access public --tag next .

      - name: verify main package integrity
        # No `attestation.url` check — without --provenance there is
        # no attestation, and that is fine for this transient release
        # (#278). Re-add attestation check once OIDC + --provenance
        # are restored post-0.7.0.
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          version=$(jq -r .version package.json)
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          integrity=$(npm view "@fgjcarlos/nodered-mcp@${version}" dist.integrity)
          if [ -z "$integrity" ]; then
            echo "main package lacks registry integrity"
            exit 1
          fi

      - name: install and launch canary from npm registry
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          prefix=$(mktemp -d)
          trap 'rm -rf "$prefix"' EXIT
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund \
            "@fgjcarlos/nodered-mcp@${version}"
          reported=$($prefix/bin/nodered-mcp version)
          if [[ "$reported" != *"$version"* ]]; then
            echo "canary executable reported '$reported', expected $version"
            exit 1
          fi
          echo "canary install passed: $reported"

      - name: promote main package to latest
        # Same auth path as publish main package (see #278): the
        # meta package has no Trusted Publisher until re-created on
        # npmjs post-0.7.0, so we use NPM_SECRET here. After Trusted
        # Publisher is restored, switch this back to OIDC by removing
        # the env block and the ~/.npmrc write.
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          version=$(jq -r .version package.json)
          echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          npm dist-tag add "@fgcarlos/nodered-mcp@${version}" latest
          latest=$(npm view @fgcarlos/nodered-mcp dist-tags.latest)
          if [ "$latest" != "$version" ]; then
            echo "latest tag is $latest, expected $version"
            exit 1
          fi

      - name: deprecate broken 0.6.2 npm release
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          if npm view "@fgjcarlos/nodered-mcp@0.6.2" version >/dev/null 2>&1; then
            echo "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
            npm deprecate "@fgjcarlos/nodered-mcp@0.6.2" \
              "Broken Windows installer; upgrade to @fgjcarlos/nodered-mcp@latest"
          fi
