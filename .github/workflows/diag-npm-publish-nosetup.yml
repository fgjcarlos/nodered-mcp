name: diag-npm-publish-nosetup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-npm-publish-nosetup.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: v0.7.0
          fetch-depth: 0

      # NO setup-node.

      - name: build tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout v0.7.0 -- npm/ scripts/build-platform-packages.js
          mkdir -p dist
          gh release download "v0.7.0" --repo "${{ github.repository }}" --pattern '*.tar.gz' --pattern 'checksums.txt' --dir dist
          cd dist && sha256sum --ignore-missing --check checksums.txt && cd ..
          node scripts/build-platform-packages.js --version 0.7.0 --dist dist --out npm-packages
          npm --version
          echo "--- env vars:"
          env | grep -i NPM | head -5

      - name: try with absolute path - NO setup-node
        env:
          NPM_SECRET: ${{ secrets.NPM_SECRET }}
        run: |
          printf "%s\n" "//registry.npmjs.org/:_authToken=${NPM_SECRET}" > ~/.npmrc
          PWD=$(realpath npm-packages)
          for pkg in nodered-mcp-win32-x64 nodered-mcp-win32-arm64 nodered-mcp-linux-x64 nodered-mcp-linux-arm64 nodered-mcp-darwin-arm64; do
            tarball="${pkg}-0.7.0.tgz"
            scope="@fgjcarlos/${pkg}"
            if npm view "${scope}@0.7.0" version >/dev/null 2>&1; then
              echo "already published, skip"
              continue
            fi
            echo "--- publishing $PWD/$tarball ---"
            npm publish --access public --tag next "$PWD/$tarball" 2>&1 | tail -8 || true
          done
