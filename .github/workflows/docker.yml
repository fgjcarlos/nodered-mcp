name: docker

# Mirror of release.yml's trigger — every pushed tag produces a fresh
# image, so a release that publishes a binary also publishes a runnable
# container. Two artefacts for the same SHA, discoverable from GitHub
# (ghcr.io/fgjcarlos/nodered-mcp) and from the releases page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Multi-arch needs QEMU under buildx; without it the runner only
      # builds linux/amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Login to GHCR with the workflow's default GITHUB_TOKEN. Public
      # repos get push rights to packages for free; no extra secrets
      # needed.
      - name: log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The default tag set covers the typical "I want the latest"
          # case (`:latest`), the "I want the latest 0.5" case
          # (`:0.5`), the "I want this exact version" case (`:0.5.0`),
          # and the SHA-pinned case (`:v0.5.0`). One image, four
          # references.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache is free for public repos and shaves a minute off
          # the cold-build case. Layer cache between tag builds is the
          # difference between 30s and 90s on Go projects.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA-build provenance + SBOM (issue #179). Buildx >= 0.11
          # emits both inline. `mode=max` is set on cache-to above so
          # the SBOM attestation can be rebuilt on cache hits.
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}