name: docker

# Mirror of release.yml's trigger — every pushed tag produces a fresh
# image, so a release that publishes a binary also publishes a runnable
# container. Two artefacts for the same SHA, discoverable from GitHub
# (ghcr.io/fgjcarlos/nodered-mcp) and from the releases page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Multi-arch needs QEMU under buildx; without it the runner only
      # builds linux/amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Login to GHCR with the workflow's default GITHUB_TOKEN. Public
      # repos get push rights to packages for free; no extra secrets
      # needed.
      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The default tag set covers the typical "I want the latest"
          # case (`:latest`), the "I want the latest 0.5" case
          # (`:0.5`), the "I want this exact version" case (`:0.5.0`),
          # and the SHA-pinned case (`:v0.5.0`). One image, four
          # references.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache is free for public repos and shaves a minute off
          # the cold-build case. Layer cache between tag builds is the
          # difference between 30s and 90s on Go projects.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA-build provenance + SBOM (issue #179). Buildx >= 0.11
          # emits both inline. `mode=max` is set on cache-to above so
          # the SBOM attestation can be rebuilt on cache hits.
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}