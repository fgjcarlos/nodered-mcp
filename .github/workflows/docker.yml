name: docker

# Mirror of release.yml's trigger — every pushed tag produces a fresh
# image, so a release that publishes a binary also publishes a runnable
# container. Two artefacts for the same SHA, discoverable from GitHub
# (ghcr.io/fgjcarlos/nodered-mcp) and from the releases page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# One image build per tag.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Issue #349: the CI suite of the tagged commit is the gate for the
  # image push, exactly as it is for the GitHub Release. ci.yml is
  # called as a reusable workflow, so it runs against this run's
  # github.sha — the tagged commit — and a failing test, race or vet
  # publishes no image at all.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The guard below reads the repository tag list to decide
          # whether this tag may take the moving `latest` tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 18

      # Multi-arch needs QEMU under buildx; without it the runner only
      # builds linux/amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Login to GHCR with the workflow's default GITHUB_TOKEN. Public
      # repos get push rights to packages for free; no extra secrets
      # needed.
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #349: the moving `latest` image tag follows the same rule
      # as the other channels — only a stable tag that is the newest
      # stable version in the repository takes it. A prerelease or a
      # re-run of an older tag still publishes its versioned image and
      # leaves `latest` where it is.
      - name: decide the latest image tag
        id: guard
        run: node scripts/release-latest-guard.js --tag "${{ github.ref_name }}"

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=false` turns off metadata-action's own automatic
          # latest tag: the floating channel is decided by the shared
          # guard above, not by metadata-action's semver analysis.
          flavor: |
            latest=false
          # The versioned references (:0.8.0, :0.8, :0) plus the
          # moving :latest, which only the newest stable tag gets.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.guard.outputs.promote == 'true' }}

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache is free for public repos and shaves a minute off
          # the cold-build case. Layer cache between tag builds is the
          # difference between 30s and 90s on Go projects.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA-build provenance + SBOM (issue #179). Buildx >= 0.11
          # emits both inline. `mode=max` is set on cache-to above so
          # the SBOM attestation can be rebuilt on cache hits.
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
