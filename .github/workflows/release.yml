name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable

      # Install syft for the CycloneDX SBOM step the goreleaser
      # config requires. Anchored to the SHA per the OpenSSF
      # Scorecard supply-chain work; bump with the goreleaser image
      # when syft ships a release that changes the catalog format.
      - name: Install syft for SBOM
        uses: anchore/syft-action@1d603b75286fccda31994d00789a3e0d76b08425  # v0.3.0
        with:
          syft-version: v1.27.0

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
