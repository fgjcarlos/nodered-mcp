name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Issue #258: real-artifact inspection. Run goreleaser in
  # --snapshot mode against the tag's source tree, then assert
  # every generated archive matches the native-package expectations
  # (flat layout, correct binary naming per platform, non-empty
  # binaries, checksums.txt internally consistent). Fails before
  # the publish job runs, so a half-built release cannot publish
  # a working GitHub Release. The same snapshot script also runs
  # on every PR via ci.yml's release-snapshot job.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: install checksum-verified syft for snapshot SBOMs
        run: bash scripts/install-syft.sh

      - name: build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean --skip=publish

      - name: inspect release snapshot
        run: node scripts/release-snapshot.js --skip-build

      - name: upload inspected snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-snapshot-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  release-artifact-smoke:
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 18

      - name: download inspected snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-snapshot-dist
          path: dist

      - name: install packed npm package and launch native CLI
        run: node scripts/release-artifact-smoke.js --dist-dir dist

  goreleaser:
    needs: release-artifact-smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: install checksum-verified syft for SBOMs
        run: bash scripts/install-syft.sh

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
